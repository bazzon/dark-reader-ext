<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <style>
        body {
            width: 260px;
            background-color: #1a1a1a;
            color: #eee;
            font-family: system-ui;
            padding: 12px;
        }
        header {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 14px;
            word-break: break-word;
        }
        .row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }
        .row label {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            cursor: pointer;
        }
        button {
            display: block;
            width: 100%;
            padding: 8px;
            border-radius: 6px;
            background-color: #2a2a2a;
            color: #eee;
            border: 1px solid #444;
            cursor: pointer;
            box-sizing: border-box;
            margin-bottom: 6px;
        }
        #openOptions {
            display: block;
            text-align: center;
            margin-top: 10px;
            font-size: 12px;
            color: #888;
            text-decoration: none;
            cursor: pointer;
        }

    </style>
</head>
<body>
    <header id="host"></header>

    <div class="row">
        <label>
            <span>Dark mode</span>
            <input type="checkbox" id="toggle">
        </label>
    </div>

    <div class="row">
        <label>
            <span>Enable everywhere</span>
            <input type="checkbox" id="globalToggle">
        </label>
    </div>

    <button id="force">Always dark here</button>
    <button id="exclude">Never on this site</button>
    <a id="openOptions" href="#">Settings</a>


    <script src="popup.js"></script>
</body>
</html>
