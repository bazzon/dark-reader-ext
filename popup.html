<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <style>
        html {
            background: #0a0f1c;
        }
        body {
            width: 260px;
            margin: 0;
            background-color: #0a0f1c;
            color: #eee;
            font-family: system-ui;
            padding: 12px;
            box-sizing: border-box;
            overflow: hidden;
        }
        .topbar {
            display: flex;
            align-items: flex-start;
            margin-bottom: 14px;
        }
        .topbar #host {
            flex: 1;
            margin-left: 10px;
            font-size: 15px;
            line-height: 1.3;
            text-align: right;
            word-break: break-word;
        }
        header {
            font-size: 18px;
            font-weight: bold;
            color: #e8eef7;
            word-break: break-word;
        }
        .row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }
        .row label {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            color: #b9c6d9;
            cursor: pointer;
        }
        #mode {
            width: 100%;
            padding: 6px;
            border-radius: 6px;
            border: 1px solid #223049;
            background: #111a2b;
            color: #b9c6d9;
            box-sizing: border-box;
        }
        #mode:disabled {
            opacity: 0.4;
        }
        button {
            display: block;
            width: 100%;
            padding: 8px;
            border-radius: 8px;
            border: 1px solid transparent;
            cursor: pointer;
            box-sizing: border-box;
            margin-bottom: 6px;
        }
        button:disabled {
            opacity: 0.4;
        }
        #force {
            background-color: #4f7cff;
            border-color: #4f7cff;
            color: #ffffff;
        }
        #force:hover:not(:disabled) {
            background-color: #3d6ae8;
        }
        #exclude {
            background-color: #1f1215;
            border-color: #46212a;
            color: #f87171;
        }
        #exclude:hover:not(:disabled) {
            background-color: #2a171b;
        }
        .range-row {
            margin-bottom: 10px;
        }
        .range-row label {
            display: flex;
            justify-content: space-between;
            margin-bottom: 4px;
            color: #b9c6d9;
        }
        .range-row input[type="range"] {
            -webkit-appearance: none;
            appearance: none;
            width: 100%;
            height: 22px;
            margin: 0;
            padding: 0;
            background: transparent;
            box-sizing: border-box;
        }
        .range-row input[type="range"]::-webkit-slider-runnable-track {
            height: 4px;
            border-radius: 2px;
            background: #182338;
        }
        .range-row input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 14px;
            height: 14px;
            margin-top: -5px;
            border: none;
            border-radius: 50%;
            background: #ffffff;
        }
        .range-row input[type="range"]:disabled {
            opacity: 0.4;
        }

        input[type="checkbox"] {
            position: absolute;
            opacity: 0;
            margin: 0;
            cursor: pointer;
        }
        .track {
            position: relative;
            flex-shrink: 0;
            width: 40px;
            height: 22px;
            border-radius: 11px;
            background: #182338;
            transition: background 0.2s ease;
        }
        .track::before {
            content: "";
            position: absolute;
            top: 2px;
            left: 2px;
            width: 18px;
            height: 18px;
            border-radius: 50%;
            background: #8896ab;
            transition: transform 0.2s ease;
        }
        input[type="checkbox"]:checked + .track {
            background: #4f7cff;
        }
        input[type="checkbox"]:checked + .track::before {
            background: #ffffff;
            transform: translateX(18px);
        }
        input[type="checkbox"]:focus-visible + .track {
            box-shadow: 0 0 0 2px rgba(79, 124, 255, 0.5);
        }
        input[type="checkbox"]:disabled + .track {
            opacity: 0.4;
        }

        #brightnessValue,
        #contrastValue {
            font-family: monospace;
            color: #4f7cff;
        }

        .divider {
            border-top: 1px solid #182338;
            margin-bottom: 10px;
        }

        #openOptions {
            display: flex;
            align-items: center;
            flex-shrink: 0;
            color: #5a6b87;
            text-decoration: none;
            cursor: pointer;
        }
        #openOptions:hover {
            color: #8fa3c4;
        }
        #openOptions:hover svg {
            stroke: #8fa3c4;
        }

    </style>
</head>
<body>
    <div class="topbar">
        <a id="openOptions" href="#" aria-label="Settings">
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#5a6b87" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="3"></circle>
                <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
            </svg>
        </a>
        <header id="host"></header>
    </div>

    <div class="row">
        <label>
            <span>Dark mode</span>
            <input type="checkbox" id="toggle">
            <span class="track"></span>
        </label>
    </div>

    <div class="row">
        <label>
            <span>Enable everywhere</span>
            <input type="checkbox" id="globalToggle">
            <span class="track"></span>
        </label>
    </div>

    <div class="row">
        <select id="mode" aria-label="Filter mode">
            <option value="invert">Invert</option>
            <option value="grayscale">Grayscale</option>
            <option value="sepia">Sepia</option>
        </select>
    </div>

    <div class="range-row">
        <label for="brightness"><span>Brightness</span><span id="brightnessValue">100</span></label>
        <input type="range" id="brightness" min="50" max="150" value="100">
    </div>

    <div class="range-row">
        <label for="contrast"><span>Contrast</span><span id="contrastValue">100</span></label>
        <input type="range" id="contrast" min="50" max="150" value="100">
    </div>

    <div class="divider"></div>

    <button id="force">Always dark here</button>
    <button id="exclude">Never on this site</button>

    <script src="popup.js"></script>
</body>
</html>
