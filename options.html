<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <style>
        body {
            background-color: #1a1a1a;
            color: #eee;
            font-family: system-ui;
            padding: 20px;
            max-width: 600px;
        }
        .row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: #2a2a2a;
            border: 1px solid #444;
            border-radius: 4px;
            padding: 8px 12px;
            margin-bottom: 8px;
        }
        button {
            background-color: #333;
            color: #eee;
            border: 1px solid #555;
            border-radius: 4px;
            padding: 4px 10px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <h2>Excluded sites</h2>
    <div id="excludedList"></div>

    <h2>Always dark</h2>
    <div id="forcedList"></div>

    <script src="options.js"></script>
</body>
</html>
